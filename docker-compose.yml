services:
  postgres:
    image: postgres:16
    container_name: greenhouse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greenhouse}
      POSTGRES_USER: ${POSTGRES_USER:-greenhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenhouse}

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greenhouse} -d ${POSTGRES_DB:-greenhouse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-greenhouse}:${POSTGRES_PASSWORD:-greenhouse}@postgres:5432/${POSTGRES_DB:-greenhouse}
      CORS_ORIGINS: http://localhost:5173

    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    ports:
      - "5173:5173"

    environment:
      VITE_API_BASE_URL: http://localhost:8000

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules: